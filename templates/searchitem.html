<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="/static/search.css">
</head>
<body>

<form action="/search" method="get">
    <h2 class="heading">Found some queries</h2>

    <div class="container">
        {% for i in users %}
        <div class="card">
            <h3>{{i.title}}</h3>
            <p>{{i.context}}</p>
        </div>
        {% endfor %}
    </div>
</form>

</body>
</html>
